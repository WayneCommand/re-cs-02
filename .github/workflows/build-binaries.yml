name: Build Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and upload binaries
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget libelf-dev

      # RE-CS-02 landed in main only (commit 53a8e7b, 2026-01). v25.12.x does
      # not know the device symbol, so do NOT pin a 25.12 tag here.
      - name: Clone OpenWRT
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git --depth=1
      
      - name: Update Feeds
        run: |
          cd openwrt
          echo "src-git openclash https://github.com/vernesong/OpenClash" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Config
        run: |
          cp re-cs-02.config openwrt/.config
          cd openwrt
          make defconfig
          # fail fast instead of silently building an empty target if the
          # device symbol is unknown (wrong branch / feeds not installed)
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y' .config
      
      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)
      
      - name: Build firmware
        run: |
          cd openwrt
          make V=s -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-qualcommax-ipq60xx-jdcloud_re-cs-02
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*sysupgrade*
            openwrt/bin/targets/qualcommax/ipq60xx/*initramfs*
