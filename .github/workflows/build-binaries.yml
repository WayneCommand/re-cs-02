name: Build Binaries

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  # Pinned ppe-nss commit. The branch is rebased often, so pin a SHA and bump
  # it deliberately: the tree carries kernel/ath11k patches, not just packages.
  PPE_NSS_COMMIT: a36798aba6cf18e2c712d5ce8dc32685a0c30aae

jobs:
  build:
    name: Build and upload binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget libelf-dev

      # Base tree is openwrt-ppe-nss (openwrt main + PPE flowtable + NSS Wi-Fi
      # series), not upstream main: Wi-Fi offload needs the ath11k/qca_edma
      # patches and nss-wifi-drv, none of which a feed can deliver.
      - name: Clone OpenWRT (ppe-nss)
        run: |
          # partial clone: all commits available for the pinned SHA, blobs
          # fetched on checkout only
          git clone --filter=blob:none --no-checkout https://github.com/JuliusBairaktaris/openwrt-ppe-nss.git openwrt
          cd openwrt
          git checkout $PPE_NSS_COMMIT

      - name: Update Feeds
        run: |
          cd openwrt
          echo "src-git openclash https://github.com/vernesong/OpenClash" >> feeds.conf.default
          echo "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;ppe-nss" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Config
        run: |
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          chmod +x openwrt/files/etc/uci-defaults/*
          cp re-cs-02.config openwrt/.config
          cd openwrt
          make defconfig
          # fail fast instead of silently building an empty target if the
          # device or the NSS symbols are unknown (wrong base tree / feeds)
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y' .config
          grep -q '^CONFIG_PACKAGE_kmod-nss-wifi-drv=y' .config

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make V=s -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-qualcommax-ipq60xx-jdcloud_re-cs-02-nss
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*sysupgrade*
            openwrt/bin/targets/qualcommax/ipq60xx/*initramfs*
