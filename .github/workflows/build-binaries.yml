name: Build Binaries

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  # Pinned ppe-nss commit. The branch is rebased often, so pin a SHA and bump
  # it deliberately: the tree carries kernel/ath11k patches, not just packages.
  PPE_NSS_COMMIT: a36798aba6cf18e2c712d5ce8dc32685a0c30aae
  # rules.mk puts the cache in $(TOPDIR)/.ccache and disables compression,
  # so keep the size in check: the repo shares a 10 GB cache budget with dl/.
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    name: Build and upload binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget libelf-dev ccache

      # Base tree is openwrt-ppe-nss (openwrt main + PPE flowtable + NSS Wi-Fi
      # series), not upstream main: Wi-Fi offload needs the ath11k/qca_edma
      # patches and nss-wifi-drv, none of which a feed can deliver.
      - name: Clone OpenWRT (ppe-nss)
        run: |
          # partial clone: all commits available for the pinned SHA, blobs
          # fetched on checkout only
          git clone --filter=blob:none --no-checkout https://github.com/JuliusBairaktaris/openwrt-ppe-nss.git openwrt
          cd openwrt
          git checkout $PPE_NSS_COMMIT

      # Only the feeds we actually use. The stock feeds.conf.default also pulls
      # routing, telephony and video; video alone drags in qt5 and its
      # recursive-dependency noise, and none of them provide a package we select.
      - name: Write feeds.conf
        run: |
          cat > openwrt/feeds.conf <<'EOF'
          src-git packages https://git.openwrt.org/feed/packages.git
          src-git luci https://git.openwrt.org/project/luci.git
          src-git openclash https://github.com/vernesong/OpenClash
          src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;ppe-nss
          EOF

      # luci-theme-aurora is not in the luci feed; upstream asks for it to be
      # cloned into package/ (it is a single package, not a feed).
      - name: Add luci-theme-aurora
        run: |
          git clone --depth=1 https://github.com/eamonxg/luci-theme-aurora.git openwrt/package/luci-theme-aurora

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          # Targeted install (install_src pulls the dependencies of each source
          # package). Installing every package of every feed only adds ~4000
          # source dirs to the kconfig tree, which is where the
          # recursive-dependency errors came from.
          ./scripts/feeds install \
            luci luci-app-firewall luci-app-sqm luci-app-https-dns-proxy \
            luci-proto-wireguard luci-app-openclash \
            sqm-scripts https-dns-proxy htop \
            openssh-server openssh-sftp-server wireguard-tools \
            nss-firmware
          # kmod-nss-wifi-drv (in-tree) depends on the feed package
          # nss-firmware; if it is not installed as a source dir, kconfig
          # warns "has a dependency on 'nss-firmware', which does not exist"
          # and apk fails later at package/install with "no such package".
          test -e package/feeds/nss/nss-firmware

      - name: Restore dl cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-${{ env.PPE_NSS_COMMIT }}-${{ hashFiles('re-cs-02.config') }}
          restore-keys: |
            dl-${{ runner.os }}-${{ env.PPE_NSS_COMMIT }}-
            dl-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ runner.os }}-${{ env.PPE_NSS_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.PPE_NSS_COMMIT }}-
            ccache-${{ runner.os }}-

      - name: Custom Config
        run: |
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          chmod +x openwrt/files/etc/uci-defaults/*
          cp re-cs-02.config openwrt/.config
          cd openwrt
          make defconfig
          # defconfig silently drops unknown symbols; fail instead of shipping
          # a firmware that is missing the theme, the language or the offload
          sh ../scripts/check-config.sh .config

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make V=s -j$(nproc)

      - name: ccache stats
        if: always()
        run: |
          ccache --version | head -1
          CCACHE_DIR="$PWD/openwrt/.ccache" ccache --show-stats || true

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: openwrt-qualcommax-ipq60xx-jdcloud_re-cs-02-nss
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*sysupgrade*
            openwrt/bin/targets/qualcommax/ipq60xx/*initramfs*
            openwrt/bin/targets/qualcommax/ipq60xx/sha256sums
            openwrt/bin/targets/qualcommax/ipq60xx/profiles.json
